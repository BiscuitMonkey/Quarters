<title>Quarters V5</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width app column, screens stacked in #stage, floating tab bar, bottom sheets. Single light look. */
:root{--nav:#FFFFFF;--nav-off:#255A9B;--nav-pill:#255A9B;--nav-on:#FFFFFF;
  --ink:#16181D; --muted:#5B606B; --ground:#F7F6F3; --card:#FFFFFF; --line:#E7E5E0; --hair:#EFEDE9;
  --well:#E9E7E2; --soft:#F1EFEA; --track:#D6D3CC; --money:#FFC83D; --chore:#255A9B; --chore-soft:#DCE6F4;
  --zelle:#6D1ED4; --good:#1F7A4D; --good-bg:#DDEFE5; --good-fg:#1F5A3A; --warn-bg:#FCE3E1; --warn-fg:#8A0500;
  --pend-bg:#FFF1C9; --pend-fg:#6B4E00; --scan:#1D1F24; --tab-off:#C9CCD3;
  --font:"Manrope", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--ground)}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
/* On a real phone, opened from the Home Screen, content runs under the status bar: push the screens below it */
@media (max-width:599px){#app{--ti:env(safe-area-inset-top,0px);position:fixed;top:0;left:0;right:0;height:var(--vh,100%)}}
html.pwa,html.pwa body{height:var(--vh,100%);overflow:hidden}
@media (max-width:599px){html.pwa #app{position:absolute}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button{transition:transform .12s}
button:focus-visible,input:focus-visible{outline:2px solid var(--chore);outline-offset:2px}
p{margin:0}
#stage{position:absolute;inset:0;top:var(--ti,0px)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--ground);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;box-shadow:-14px 0 20px -12px rgba(22,24,29,.18)}
.scr.dark{background:var(--scan);color:#fff}
.inner{padding:20px 20px 120px}
.inner.tight{padding-top:6px}
.h1{margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h1.home{font-size:26px;line-height:32px}
.h2{margin:0;font-size:18px;font-weight:800}
.sub{margin-top:4px;font-size:13px;color:var(--muted)}
.sub strong{color:var(--ink)}
.lead{margin-top:6px;font-size:14px;line-height:20px;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.sec{margin-top:28px}
.hero2 ~ .sec{margin-top:12px} /* V5: Home rows sit closer to the hero and each other */
.hero2 ~ .sec + .sec{margin-top:6px}
.hero2 ~ .sec .grid4{margin-top:4px}
.scr.fixed{overflow-y:hidden}
.scr.fixed>.inner{padding-bottom:0}
.scr.fixed .sec{margin-top:18px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{border:0;background:none;padding:10px 0;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.btn{height:44px;border:0;border-radius:22px;padding:0 18px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.ink{background:var(--chore);color:#fff}
.btn.out{background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
.btn.zelle{background:var(--zelle);color:#fff}
.btn.money{background:var(--money);color:var(--ink)}
.btn.chore{background:var(--chore);color:#fff}
.btn.lg{width:100%;height:54px;border-radius:27px;font-size:16px;font-weight:800}
.btn.wide{width:100%;height:52px;border-radius:26px;font-size:15px}
.btn.sm{height:36px;padding:0 12px;border-radius:18px;font-size:13px}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;flex:none}
.av{position:relative;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink)}
.av.dash{background:var(--card)}
.av .dring{position:absolute;inset:0;pointer-events:none}
#docMain[hidden],#docResults[hidden],.srch-cancel[hidden]{display:none}
.remb{flex:none}
.remb.sent{color:var(--muted)}
.remlink{display:inline-flex;align-items:center;gap:5px;padding:4px 0;font-size:13px;font-weight:600;color:var(--ink)}
.remlink.sent{color:var(--muted)}
.irows{display:flex;flex-direction:column;gap:8px}
.irow{display:flex;gap:8px;align-items:center}
.irow .input{flex:1;min-width:0}
.irow .input.amt{flex:none;width:112px}
.ixbtn{flex:none;background:none;border:0;padding:0;width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--muted)}
.crow.locked .check{opacity:.35}
.crow.locked .check.on{opacity:.55}
.chk{position:absolute;right:-3px;bottom:-3px;border-radius:50%;background:var(--ink);border:2px solid var(--card);display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 8px;margin-left:-8px;border:0;background:none;font-size:15px;font-weight:700}
.seg{margin-top:14px;display:flex;background:var(--well);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg{position:relative}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:10px;background:var(--card);box-shadow:0 1px 2px rgba(22,24,29,.1);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.seg[data-active="shared"] .seg-ind{transform:translateX(calc(100% + 4px))}
.seg button{position:relative;z-index:1}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:700}
.list>*+*{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 16px;border:0;background:none;text-align:left}
.row .t{display:block;font-size:15px;font-weight:700}
.row .s{display:block;font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #A3A099;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.check svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on.blue{background:var(--chore);border-color:var(--chore)}
.check.on svg{opacity:1;transform:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.grid4{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 24px) / 4);gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;margin-left:-20px;margin-right:-20px;padding:2px 20px 4px;scroll-padding:0 20px}
.grid4::-webkit-scrollbar{display:none}
.hscroll{position:relative}
.hscroll::before,.hscroll::after{content:'';position:absolute;top:0;bottom:0;width:24px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.hscroll::after{right:-20px;background:linear-gradient(to left,rgba(22,24,29,.12),rgba(22,24,29,0))}
.hscroll::before{left:-20px;background:linear-gradient(to right,rgba(22,24,29,.12),rgba(22,24,29,0))}
.hscroll.more-r::after,.hscroll.more-l::before{opacity:1}

.pcol{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pn{font-size:13px;font-weight:700}
.ps{margin-top:-4px;font-size:12px;color:var(--muted)}
.bar{display:block;width:56px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:4px;border-radius:2px;background:var(--chore)}
.track{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.track>span{display:block;height:8px;border-radius:4px;background:var(--ink)}
.anim-w{width:100%!important;transform:translateX(-100%);will-change:transform}
.hpie{position:relative;border-radius:50%;overflow:hidden;isolation:isolate}
.hpie.full{background:var(--m)!important}
.hpie.full>.hclip{visibility:hidden}
.hclip{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
.hclip.r{left:50%}.hclip.l{left:0}
.hdisc{position:absolute;top:0;width:200%;height:100%;border-radius:50%;will-change:transform}
.hclip.r .hdisc{left:-100%}.hclip.l .hdisc{left:0}
/* the left half overlaps the right by 1px so no hairline shows along the seam; it stays invisible until the pie passes half full */
.hpie .hclip.l{width:calc(50% + 1px)}
.hpie .hclip.l .hdisc{width:calc((100% - 1px) * 2)}
.pav>.hpie{position:absolute;inset:0}
.anim-dash{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.glow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.85}}

/* home */
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hrow.finhead{z-index:6}
.hrow.finhead+.hero2{margin-top:8px}
.avbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--money);font-size:15px;font-weight:800}
.hero{position:relative;margin-top:20px;height:236px;overflow:hidden}
.carousel{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always}
.hring{position:absolute;left:16px;top:70px;width:96px;height:96px}
.hring svg{transform:rotate(-90deg)}
.hring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hring-t b{font-size:20px;font-weight:800}
.hring-t small{font-size:11px;font-weight:600;color:var(--muted)}
.htext{position:absolute;left:128px;right:20px;top:22px;display:flex;flex-direction:column;gap:6px}
.big{font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big span{font-size:15px;font-weight:600;color:var(--muted)}
.hbtns{position:absolute;left:128px;right:20px;bottom:34px;display:flex;gap:8px}
.hbtns .btn{flex:1;padding:0 8px}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center}
.dots button{width:20px;height:30px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.dots button:first-child{justify-content:flex-end;padding-right:4px}
.dots button:last-child{justify-content:flex-start;padding-left:4px}
.dots span{display:block;width:6px;height:6px;border-radius:3px;background:#CFCCC6;transition:width .25s,background .25s}
.dots button[aria-pressed="true"] span{width:16px;background:var(--ink)}
.roundgo{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--chore);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.pcard{padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left}
.pcard svg{transform:rotate(-90deg)}
.pcard .t{display:block;font-size:15px;font-weight:700}
.pcard .s{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}

/* pennies */
.mhead{position:relative}
.help{position:absolute;right:0;top:4px;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:var(--well);font-size:16px;font-weight:800}
.pop{position:absolute;right:0;top:44px;z-index:5;width:280px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px rgba(22,24,29,.15);display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:18px;color:var(--muted);animation:popin .22s cubic-bezier(.2,.8,.2,1)}
.pop b{font-size:14px;color:var(--ink)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.well{margin-top:20px;height:200px;border-radius:24px;background:var(--well);display:flex;align-items:center;justify-content:center;gap:40px}
.pbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:700}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px}

/* bills */
.cal{margin-top:16px;padding:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;text-align:center}
.wd{font-size:11px;font-weight:600;color:var(--muted)}
.day{width:38px;height:38px;margin:2px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:1px solid transparent;font-variant-numeric:tabular-nums}
.calfoot{margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);display:flex;justify-content:flex-end;align-items:baseline}
.mbtn{height:32px;padding:0 10px;border:0;border-radius:16px;background:var(--soft);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.mbtn svg{transition:transform .25s}
.stack{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.bill{padding:16px;display:flex;flex-direction:column;gap:14px}
.hbtn.yellow{background:#FFC83D;color:var(--ink)}
.attach{display:flex;gap:10px;margin-top:8px}
.attach .btn{flex:1;height:48px;border-radius:14px;font-size:14px;font-weight:600;border:1.5px dashed #A3A099;background:transparent;color:var(--ink)}
.attach .btn svg{color:var(--muted)} /* V5: optional actions read quieter than the primary Add bill button */
.attfile{display:flex;align-items:center;gap:12px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.attfile .ft{width:36px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.attfile .x{width:32px;height:32px;border:0;border-radius:50%;background:var(--well);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.mc{padding:16px;display:flex;flex-direction:column;gap:14px}
.mc h3{margin:4px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2} /* V5: bigger card titles, room freed by moving Remind to the footer */
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mc-sub{margin-top:2px;font-size:12px;color:var(--muted)}
.mc-amt{text-align:right;flex:none}
.mc-amt .amt{margin-top:0;line-height:30px}
.mc-foot{font-size:14px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap}
.mc-foot .link{font-size:14px!important}
.mc-of{margin-top:2px;font-size:14px;font-weight:600;color:var(--muted)}
.bill h3,.exp h3{margin:0;font-size:16px;font-weight:700}
.amt{margin-top:2px;font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.bfoot{padding-top:12px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:12px}
.dashbtn{height:56px;border:1.5px dashed #A3A099;border-radius:20px;background:transparent;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.paidchip{height:36px;padding:0 14px;border-radius:18px;background:var(--good-bg);color:var(--good-fg);display:flex;align-items:center;font-size:13px;font-weight:700}

/* shared */
.bal{margin-top:16px;padding:16px;display:flex;align-items:center;gap:12px}
.bal .k{font-size:12px;font-weight:600;color:var(--muted)}
.bal .v{margin-top:2px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.vr{width:1px;height:40px;background:var(--hair)}
.exp{padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.exp h3{font-weight:600}
#fab{position:absolute;left:20px;right:20px;bottom:96px;z-index:15}
#fab.hide{visibility:hidden;pointer-events:none}
#fab{display:flex;gap:10px}
#fab .btn{flex:1;min-width:0;height:56px;padding:0 12px;border-radius:28px;font-size:16px;font-weight:800;box-shadow:0 6px 16px rgba(22,24,29,.14)}
.finhead{position:sticky;top:0;z-index:5;margin:-20px -20px 0;padding:20px 20px 12px;background:var(--ground);transition:box-shadow .2s}
.finhead.stuck{box-shadow:0 1px 0 var(--line),0 6px 12px -8px rgba(22,24,29,.16)}
.finhead + .segbody{margin-top:6px}
.hbtn{width:44px;height:44px;padding:0;border-radius:50%;border:0;background:var(--chore);color:#fff;display:flex;align-items:center;justify-content:center}
.hbtn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.hacts{display:flex;gap:8px}
.pickp{width:44px;height:44px;padding:0;border-radius:50%;font-size:14px;font-weight:800;transition:background .2s}

/* scan */
.scanwrap{min-height:100%;padding:12px 20px 32px;display:flex;flex-direction:column}
.vf{position:relative;margin-top:16px;flex:1;min-height:360px;border-radius:20px;background:#34373E;overflow:hidden}
.vf i{position:absolute;width:40px;height:40px;border:3px solid #fff}
.vf .tl{left:16px;top:16px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.vf .tr{right:16px;top:16px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf .bl{left:16px;bottom:16px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.vf .br{right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf .paper{position:absolute;left:50%;top:50%;width:120px;height:180px;margin:-90px 0 0 -60px;border-radius:6px;background:#F7F6F3;opacity:.9}
.vf .beam{position:absolute;left:12%;right:12%;height:2px;background:var(--money);box-shadow:0 0 12px var(--money);animation:beam 2.2s ease-in-out infinite}
@keyframes beam{0%,100%{top:22%}50%{top:76%}}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:transparent;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}

/* chores */
.ccar{margin-top:16px}
/* V5: two-card swipe carousel (same snap + dots as Home) used on Chores and Finance */
.ctrack{display:flex;gap:40px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px;scroll-padding:0 20px;overscroll-behavior-x:contain}
.ctrack::-webkit-scrollbar{display:none}
.cslide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;min-width:0}
.cslide>*{flex:1;min-width:0;margin-top:0!important}
.ctrack.mv .cslide:not(.calslide){align-items:flex-start}
.cslide>.wk{display:flex;flex-direction:column;justify-content:center}
.ccar{position:relative}
/* dots sit inside the bottom of the card, like Home */
.cdots{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;z-index:2}
.cslide>.wk,.cslide>.cal{padding-bottom:30px}
.cslide>.wk{padding-top:18px}
.cslide>.wk .wkrow{gap:34px}
.cslide>.wk{padding-left:12px}
.cdots button{width:20px;height:26px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center}
.cdots button:first-child{justify-content:flex-end;padding-right:4px}
.cdots button:last-child{justify-content:flex-start;padding-left:4px}
.cdots span{display:block;width:6px;height:6px;border-radius:3px;background:#CFCCC6;transition:width .25s,background .25s}
.cdots button[aria-pressed="true"] span{width:16px;background:var(--ink)}
.wk{margin-top:16px;padding:16px 16px 14px;background:var(--card);border:1px solid var(--line);border-radius:24px}
.wk .top{display:flex;justify-content:space-between;align-items:center}
.wk .k{font-size:13px;font-weight:700;color:var(--muted)}
.wk .reset{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#DCE4EF;color:var(--chore)}
.wk .num{margin-top:4px;font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.01em}
.wk .num span{font-size:16px;font-weight:600;color:var(--muted)}
.wk .wkrow{display:flex;align-items:center;gap:18px}
.wk .k2{font-size:14px;font-weight:600;color:var(--muted)}
.wk .wkfig{margin:0}
.coin{position:relative;flex:none;border-radius:50%}
/* V4: one equal wedge per roommate (360/NP degrees), clipped with clip-path; the half-disc inside rotates to fill it */
.cq{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.cqdisc{position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,var(--chore) 50%,transparent 50%);will-change:transform}
.cqi{position:absolute;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:var(--ink);z-index:2}
.cgap{position:absolute;background:#fff;z-index:1}
.cgap.v{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}
.cgap.h{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.chub{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.chub b{font-size:18px;font-weight:800}
.chub small{margin-top:3px;font-size:11px;font-weight:600;color:var(--muted)}
.wk .seg1{flex:1;height:10px;border-radius:5px;background:#DCE4EF;overflow:hidden}
.wk .seg1 i{display:block;height:100%;border-radius:5px;background:var(--chore);transform-origin:left center}
.wk .seg1 i.wkin{animation:wkin .45s cubic-bezier(.33,1,.68,1) backwards}
@keyframes wkin{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.wk .seg1 i.wkin{animation:none}}
.wk .who{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);display:flex;justify-content:space-between}
.wk .who>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wk .who .pav b{color:var(--ink)}
.prog{margin-top:16px;background:var(--chore);border-radius:24px;padding:18px;display:flex;align-items:center;gap:16px;color:#fff}
.prog .disc{flex:none;width:72px;height:72px;border-radius:50%;background:#fff;color:var(--chore);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.prog .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chore-soft)}
.filter{display:flex;background:var(--well);border-radius:14px;padding:4px;gap:4px}
.filter button{height:36px;padding:0 16px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:700;transition:background .2s}
.filter button[aria-pressed="true"]{background:var(--card)}
.filter.wide{margin-top:16px;overflow-x:auto;scrollbar-width:none}
.filter.wide::-webkit-scrollbar{display:none}
.filter.wide{position:relative}
.filter.wide button{position:relative;z-index:1;flex:1 0 auto;padding:0 10px;color:var(--muted);transition:color .25s}
.filter.wide button[aria-pressed="true"]{color:var(--ink);background:transparent}
/* V4: chore filter as a row of avatars + names (fits 6 without scrolling; scrolls beyond that). Only the ring animates. */
.whobar{display:flex;align-items:center;gap:8px;margin-top:16px}
.whobtn{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px 0 8px;border:0;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:15px;font-weight:700;color:var(--ink);max-width:100%}
.whobtn .wl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whobtn svg{flex:none;color:var(--muted)}
.whoclr{width:36px;height:36px;border:0;border-radius:50%;background:var(--well);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.avstack{display:flex;align-items:center;isolation:isolate} /* keep overlap z-indexes local so stacks never paint over the sticky header */
.pscroll{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.pscroll::-webkit-scrollbar{display:none}
/* scroll hint: a soft shadow on whichever edge has more avatars beyond it */
.edge{position:relative;flex:1;min-width:0}
.edge>.pscroll{width:100%}
.edge::before,.edge::after{content:'';position:absolute;top:0;bottom:0;width:22px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.edge::before{left:-1px;background:radial-gradient(farthest-side at 0 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}
.edge::after{right:-1px;background:radial-gradient(farthest-side at 100% 50%,rgba(22,24,29,.24),rgba(22,24,29,0))}
.edge.more-l::before,.edge.more-r::after{opacity:1}
.pscroll>*{flex:none}
.avstack.ov>.av+.av{margin-left:-8px}
.avstack.ov>.av{position:relative;box-shadow:0 0 0 2px var(--card)}
/* earlier avatars sit on top so each check badge stays visible over its neighbour */
.avstack.ov>.av:nth-child(1){z-index:8}.avstack.ov>.av:nth-child(2){z-index:7}.avstack.ov>.av:nth-child(3){z-index:6}.avstack.ov>.av:nth-child(4){z-index:5}.avstack.ov>.av:nth-child(5){z-index:4}.avstack.ov>.av:nth-child(6){z-index:3}.avstack.ov>.av:nth-child(7){z-index:2}.avstack.ov>.av:nth-child(8){z-index:1}
.avstack.ov>.av.dash{background:var(--card)}
.avstack.sm>.av+.av{margin-left:-7px}
.pfilter{display:flex;gap:4px;margin:12px -20px 0;padding:8px 20px 2px;overflow-x:auto;scrollbar-width:none}
.pfilter::-webkit-scrollbar{display:none}
.pfilter button{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.pf-av{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--ink)}
.pf-ring{position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--chore);opacity:0;pointer-events:none}
.pf-all{background:var(--well);color:var(--ink)}
.pfilter button[aria-pressed="true"]{color:var(--ink);font-weight:800}
.pfilter button[aria-pressed="true"] .pf-ring{opacity:1}
.fil-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--card);box-shadow:0 1px 2px rgba(22,24,29,.1);will-change:transform}
.cqhit{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:50%;background:transparent;z-index:3}
.coin .cq,.coin .cqi{transition:opacity .25s}
.crow{min-height:64px}
.done-t{color:var(--muted)!important;font-weight:600!important;text-decoration:line-through}
.empty{padding:18px 16px;font-size:14px;color:var(--muted)}
.rot{margin-top:20px;padding:8px 16px 12px}
.rotgrid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));align-items:center;row-gap:4px}
.rotgrid .h{font-size:12px;font-weight:700;color:var(--muted);padding:10px 0;text-align:center}
.rotgrid .h:first-child{text-align:left}
.rotgrid .n{font-size:14px;font-weight:700;padding:12px 0;border-top:1px solid var(--hair)}
.rotgrid .c{display:flex;justify-content:center;padding:8px 0;border-top:1px solid var(--hair)}

/* docs */
.search{position:relative;margin-top:14px}
.search svg{position:absolute;left:14px;top:15px;color:var(--muted)}
.search input{padding-left:42px}
.soon{margin-top:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.soon .r{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.frow{min-height:68px;gap:14px}
.inner.tight .finhead{margin-top:-6px;padding-top:6px}
.folder{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;transition:border-color .2s,box-shadow .2s}
.folder[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ficon{flex:none;width:28px;height:40px;display:flex;align-items:center;justify-content:center}
.ftype{flex:none;width:36px;height:44px;border-radius:6px;background:var(--soft);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:9px;font-weight:800;color:var(--muted)}
.sectbody{padding:0 16px 16px 38px;font-size:14px;line-height:21px;color:#3A3E46;animation:popin .2s ease-out}
.sectbtn svg{transition:transform .25s}

/* chrome */
#tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:64px;padding:8px;background:var(--nav);border-radius:32px;box-shadow:0 0 0 1px #E7E5E0,0 10px 28px rgba(22,24,29,.14),0 2px 6px rgba(22,24,29,.06);display:flex;gap:4px;z-index:20;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#tabbar.hide{transform:translateY(130%);opacity:0;pointer-events:none}
/* page-colour fade behind the nav so cards scrolling underneath melt away before reaching the white bar */
#navfade{position:absolute;left:0;right:0;bottom:0;height:136px;background:linear-gradient(to bottom,rgba(247,246,243,0),rgba(247,246,243,.85) 45%,#F7F6F3 75%);z-index:19;pointer-events:none;transition:opacity .25s}
#tabbar.hide + #navfade{opacity:0}
#tabpill{position:absolute;left:0;top:8px;bottom:8px;width:0;border-radius:24px;background:var(--nav-pill);box-shadow:0 2px 6px rgba(37,90,155,.28);pointer-events:none;will-change:transform;z-index:2;overflow:hidden}
#tabpill.go{transition:transform .42s cubic-bezier(.3,1.25,.4,1),width .42s cubic-bezier(.3,1.25,.4,1)}
/* selected-colour copy of the tab row inside the pill, counter-translated so it stays put: whatever the pill covers reads white + filled */
#pillrow{position:absolute;left:0;top:-8px;height:64px;padding:8px;box-sizing:border-box;display:flex;gap:4px;will-change:transform}
#tabpill.go #pillrow{transition:transform .42s cubic-bezier(.3,1.25,.4,1)}
#pillrow .pb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--nav-on)}
#pillrow svg .sh{fill:currentColor}
#pillrow svg .dt{stroke:var(--nav-pill)}
/* broom sits high in its 20px box: nudge it down (both copies, so the pill edge stays seamless mid-slide) */
#tabbar button[data-tab="chores"] svg,#pillrow .pb:nth-child(3) svg{transform:translateY(1.5px)}
#tabbar button{position:relative;z-index:1;flex:1;border:0;border-radius:24px;background:transparent;color:var(--nav-off);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600}
#tabbar button svg .sh{fill:transparent}
#toast{position:absolute;left:16px;right:16px;top:calc(var(--ti,0px) + 12px);z-index:60;padding:14px 16px;border-radius:16px;background:#255A9B;color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 24px rgba(22,24,29,.25);transform:translateY(calc(-100% - 160px));transition:transform .38s cubic-bezier(.2,.8,.2,1);pointer-events:none;display:flex;align-items:center;gap:12px;padding-right:8px}
#toast.show{transform:none;pointer-events:auto}
#toast .tmsg{flex:1;min-width:0}
#toast .tx{flex:none;width:32px;height:32px;margin:-6px 0;border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
#sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;border:0;padding:0;background:rgba(22,24,29,.45);opacity:0;transition:opacity .3s}
.scrim:active{transform:none}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open .scrim{opacity:1}
#sheet.open .sheet{transform:none}
.grab{padding:10px 0 14px;touch-action:none;cursor:grab}
.grab span{display:block;width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto}
.sheet-body{overflow-y:auto;padding:0 20px 28px;overscroll-behavior:contain}
.sheet-body h2{margin:0;font-size:20px;font-weight:800}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.flbl{display:block;margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;height:50px;padding:0 16px;border:1px solid var(--track);border-radius:14px;background:var(--card);font:inherit;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;padding:0;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(22,24,29,.08)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legal{margin:16px 4px 8px;font-size:12px;line-height:17px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.legal strong{color:var(--ink);font-weight:700}
.tog{flex:none;position:relative;width:44px;height:26px;border-radius:13px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line);transition:background .25s,box-shadow .25s}
.tog i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(22,24,29,.14);transition:transform .3s cubic-bezier(.3,1.25,.4,1);will-change:transform}
.tog.on{background:var(--chore);box-shadow:none}.tog.on i{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* V4: rows of people chips stay on one line and scroll sideways when they don't fit */
.chips.prow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-20px;margin-right:-20px;padding:0 20px 2px}
.chips.prow::-webkit-scrollbar{display:none}
.chips.prow>*{flex:none}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--track);background:var(--card);font-size:14px;font-weight:700;transition:background .2s,border-color .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--chore);border-color:var(--chore);color:#fff}
.chip.blue[aria-pressed="true"]{background:var(--chore);border-color:var(--chore)}
.chip.day{width:44px;padding:0;font-size:12px}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-bottom:1px solid var(--hair);font-size:15px;font-weight:700}
.kv b{font-weight:800;font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
/* desktop: fixed iPhone 17 frame, 402 x 874 pt */
#app{transition:background .3s}
#app.darktop{background:var(--scan)}
@media (min-width:600px){
  html,body{background:#DEDAD3}
  body{display:flex;align-items:center;justify-content:center}
  #app{--ti:47px;flex:none;width:402px;height:874px;max-width:none;margin:0;border:0!important;border-radius:52px;box-shadow:0 0 0 11px #16181D,0 0 0 12px #3A3E46,0 30px 80px rgba(22,24,29,.35);transform:scale(var(--s,1));transform-origin:center}
  #sheet .sheet{padding-bottom:20px}
}

/* new home hero */
.hero2{user-select:none;-webkit-user-select:none;position:relative;margin:20px -20px 0;height:312px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.pie{position:absolute;top:calc(50% - 140px);width:280px;height:280px} /* V5: centred top-to-bottom in the band */
.pie-l{position:absolute;top:calc(50% - 140px);width:140px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.pie-l b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.pie-l span{font-size:15px;font-weight:500}
.hstage{position:sticky;left:0;flex:0 0 100%;margin-right:-100%;height:100%;z-index:1;pointer-events:none}
.hpies{position:absolute;inset:0;pointer-events:none;z-index:1}
/* Scroll-linked: the browser drives these from the native swipe on the compositor, at full refresh rate */
/* pies park just off-screen: half of the 280px pie + 4px */
@keyframes hpR{0%{transform:translateX(0)}50%,100%{transform:translateX(-144px)}}
@keyframes hpC{0%,50%{transform:translateX(144px)}100%{transform:translateX(0)}}
@keyframes htR{0%{opacity:1;transform:translateX(0);animation-timing-function:ease-in-out}60%,100%{opacity:0;transform:translateX(-24px)}}
@keyframes htC{0%,40%{opacity:0;transform:translateX(24px);animation-timing-function:ease-in-out}100%{opacity:1;transform:translateX(0)}}
@supports (animation-timeline: scroll()) {
  .hero2 .hp[data-i="0"]{animation:hpR linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hp[data-i="1"]{animation:hpC linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hcol[data-i="0"]{animation:htR linear both;animation-timeline:scroll(nearest inline)}
  .hero2 .hcol[data-i="1"]{animation:htC linear both;animation-timeline:scroll(nearest inline)}
}
.hp{position:absolute;inset:0;will-change:transform}
.hcols .hcol{will-change:transform,opacity}
.hcols{position:absolute;inset:0;pointer-events:none;z-index:2}
.hcols button,.hcols a{pointer-events:auto}
.hcol{position:absolute;top:0;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:11px}
.hcol .btn{margin-top:10px} /* V5: action sits lower, clear of the text */
.htitle{margin:-10px 0 6px;font-size:20px;font-weight:800;letter-spacing:-.01em} /* V5: a touch bigger, lifted above the figures */
.hcol[data-i="0"]{align-items:flex-end;text-align:right} /* V5: rent column right-aligned */
.hcol .hbar{align-self:stretch}
.hbar{display:block;height:8px;border-radius:4px;overflow:hidden}
.hbar>span{display:block;height:8px;border-radius:4px}
.pav{position:relative;width:56px;height:56px;flex:none}
.pav>svg{position:absolute;inset:0}
.pav b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.pav .chk{width:20px;height:20px;border-color:#F7F6F3;right:-2px;bottom:-2px}
/* user test mode */
#testbar{display:none;position:absolute;left:12px;right:12px;top:calc(var(--ti,0px) + 10px);z-index:55;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:16px;background:var(--zelle);color:#fff;box-shadow:0 8px 20px rgba(22,24,29,.2)}
#app.testing #testbar{display:flex}
#testbar:empty{display:none!important}
#app.testing #stage:has(~ #testbar:empty){top:var(--ti,0px)}
#app.testing #stage{top:calc(var(--ti,0px) + 82px)}
#app.testing #toast{top:calc(var(--ti,0px) + 92px)}
.tb-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.tb-t{margin-top:2px;font-size:14px;line-height:19px;font-weight:700}
.tb-g{flex:none;height:36px;padding:0 12px;border:1.5px solid rgba(255,255,255,.7);border-radius:18px;background:transparent;color:#fff;font-size:13px;font-weight:700}
#testmodal{position:absolute;inset:0;z-index:70;background:rgba(22,24,29,.5);display:flex;align-items:flex-end}
.tm{width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:popin .25s ease-out}
.tm h2{margin:0;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.01em}
.tm p{font-size:15px;line-height:22px}
.tm .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--zelle)}
.tm ul{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:21px;color:#3A3E46}
.rate{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.rate button{height:46px;border:1.5px solid var(--track);border-radius:12px;background:var(--card);font-size:16px;font-weight:800}
.rate button[aria-pressed="true"]{background:var(--zelle);border-color:var(--zelle);color:#fff}
.rate-l{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.tm textarea{width:100%;min-height:84px;margin-top:8px;padding:12px 14px;border:1px solid var(--track);border-radius:14px;font:inherit;font-size:16px;resize:vertical}
.res{width:100%;margin-top:14px;border-collapse:collapse;font-size:13px}
.res th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.res td{padding:10px 4px;border-bottom:1px solid var(--hair);vertical-align:top;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat div{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}

#sbar,#homebar{display:none}
@media (min-width:600px){
  #sbar{display:flex;position:absolute;left:0;right:0;top:0;height:47px;z-index:90;align-items:center;justify-content:space-between;padding:0 30px 0 44px;color:var(--ink);font-family:-apple-system,"SF Pro Text","SF Pro Display",var(--font);pointer-events:none}
  #app.darktop #sbar{color:#fff}
  .sb-time{width:54px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:3px}
  .sb-island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
  .sb-icons{display:flex;align-items:center;gap:6px;margin-top:3px}
  .sb-icons svg{fill:currentColor}
  .sb-batt{position:relative;width:25px;height:12px;border:1px solid currentColor;border-radius:4px;opacity:.95;padding:1.5px}
  .sb-batt::after{content:"";position:absolute;right:-3.5px;top:3.5px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.5}
  .sb-batt span{display:block;width:78%;height:100%;border-radius:2px;background:currentColor}
  #homebar{display:block;position:absolute;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:90;pointer-events:none}
  #app.darktop #homebar{background:#fff}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

</head>

    '<button class="btn zelle lg" style="margin-top:14px" data-tact="copy">Copy results</button>' +
    '<button class="btn out wide" style="margin-top:10px" data-tact="copyall">Copy all sessions on this device (' + all.length + ')</button>' +
    '<button class="btn out wide" style="margin-top:10px" data-tact="again">Next participant</button>' +
    '<button class="btn out wide" style="margin-top:10px" data-tact="exit">Finish testing</button>' +
    '<div id="tCopyBox"></div>');
}
function copyText(text) {
  function fallback() {
    var box = document.getElementById('tCopyBox');
    if (!box) return;
    box.innerHTML = '<p style="margin-top:14px;font-size:13px;color:var(--muted)">Copying is blocked here. Select all of this text and copy it:</p><textarea id="tCopyText" readonly style="min-height:140px;font-size:12px"></textarea>';
    var ta = document.getElementById('tCopyText'); ta.value = text; ta.focus(); ta.select();
  }
  try {
    navigator.clipboard.writeText(text).then(function () { say('Copied · paste it into Sheets, Excel or Notion'); }, fallback);
  } catch (e) { fallback(); }
}
function exitTest() {
  TEST.active = false; TEST.running = false; TEST.pending = null;
  app.classList.remove('testing'); testbar.innerHTML = ''; tmHide();
  try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) { D = null; }
  if (!D || !D.bills || !D.chores) D = seed(); else setRoster(D.size || 4); ensurePrefs();
  rebuild();
  if (location.hash === '#test') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } }
}
function syncName() {
  var n = document.getElementById('tName');
  if (!n || !TEST.last) return;
  TEST.last.name = n.value.trim();
  var all = loadSessions();
  if (all.length) { all[all.length - 1] = TEST.last; saveSessions(all); }
}
var TACT = {
  begin: function () { var n = document.getElementById('tName'); TEST.name = n ? n.value.trim() : ''; TEST.i = 0; taskIntro(); },
  go: goTask,
  giveup: function () { if (TEST.running) finishTask(false); },
  rate: function (d) { TEST.rating = +d.v; tmBody.querySelectorAll('.rate button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.v === TEST.rating)); }); },
  next: nextTask,
  copy: function () { syncName(); copyText(THEAD + '\n' + sessionRows(TEST.last).join('\n')); },
  copyall: function () { syncName(); var all = loadSessions(); copyText(THEAD + '\n' + all.map(sessionRows).reduce(function (a, b) { return a.concat(b); }, []).join('\n')); },
  again: function () { syncName(); TEST.active = false; startTest(); },
  exit: function () { syncName(); exitTest(); }
};
function tactClick(e) {
  var t = e.target.closest('[data-tact]');
  if (!t) return;
  var fn = TACT[t.dataset.tact];
  if (fn) { e.preventDefault(); fn(t.dataset); }
}
tm.addEventListener('click', tactClick);
testbar.addEventListener('click', tactClick);

var _endSwipe = null;

/* Phones: size the app to the area the browser actually draws (window.innerHeight), so the nav is never cut off,
   in Safari with its bars or opened from the Home Screen */
function fitVH() {
  var de = document.documentElement;
  var pwa = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  /* iOS Home Screen apps report a layout height shorter than the screen (it leaves out the status-bar strip),
     which left an unused band at the bottom. There, size everything to the full screen height instead. */
  var h = window.innerHeight;
  if (pwa && window.innerWidth < 600) {
    var full = window.innerWidth <= window.innerHeight ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    if (full > h) h = full;
    de.classList.add('pwa');
  } else de.classList.remove('pwa');
  de.style.setProperty('--vh', h + 'px');
}
fitVH(); window.addEventListener('resize', fitVH); window.addEventListener('orientationchange', function () { setTimeout(fitVH, 300); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitVH);
function fitFrame() {
  if (window.innerWidth >= 600) {
    var sc = Math.min(1, (window.innerHeight - 56) / 874, (window.innerWidth - 56) / 402);
    app.style.setProperty('--s', Math.max(0.4, sc).toFixed(3));
  } else app.style.removeProperty('--s');
}
fitFrame();
window.addEventListener('resize', fitFrame);
function tick() {
  var d = new Date(), h = d.getHours() % 12 || 12, mi = d.getMinutes();
  var el = document.getElementById('sbTime'); if (el) el.textContent = h + ':' + (mi < 10 ? '0' : '') + mi;
}
tick(); setInterval(tick, 20000);
/* ---------- start ---------- */
var first = makeScreen('home');
first.classList.add('cur');
stage.appendChild(first);
chrome(); animate(first); hooks(first);
})();
</script>
